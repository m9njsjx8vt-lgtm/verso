name: Verso
options:
  bundleIdPrefix: com.tomoro
  deploymentTarget:
    macOS: "13.0"
  developmentLanguage: ja
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
    PRODUCT_NAME: Verso
    PRODUCT_BUNDLE_IDENTIFIER: com.tomoro.verso
targets:
  Verso:
    type: application
    platform: macOS
    sources:
      - path: Sources/Verso
    info:
      path: Sources/Verso/Generated-Info.plist
      properties:
        LSUIElement: true
        LSMinimumSystemVersion: "13.0"
        CFBundleShortVersionString: "0.3.3"
        CFBundleVersion: "6"
        CFBundleDisplayName: Verso
        CFBundleIconFile: AppIcon
        NSHighResolutionCapable: true
        NSAppleEventsUsageDescription: "Verso pastes translated text into your active application using keyboard events."
        NSScreenCaptureUsageDescription: "Verso captures the area you select to OCR and translate the text in it."
        NSHumanReadableCopyright: "© 2026 Tomoro Iwasaki"
    entitlements:
      path: Sources/Verso/Verso.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.network.client: true
