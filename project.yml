name: Tomo
options:
  bundleIdPrefix: com.tomoro
  deploymentTarget:
    macOS: "13.0"
  developmentLanguage: ja
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
    PRODUCT_NAME: Tomo
    PRODUCT_BUNDLE_IDENTIFIER: com.tomoro.tomo
targets:
  Tomo:
    type: application
    platform: macOS
    sources:
      - path: Sources/Tomo
    info:
      path: Sources/Tomo/Generated-Info.plist
      properties:
        LSUIElement: true
        LSMinimumSystemVersion: "13.0"
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        CFBundleDisplayName: Tomo
        CFBundleIconFile: AppIcon
        NSHighResolutionCapable: true
        NSAppleEventsUsageDescription: "Tomo pastes translated text into your active application using keyboard events."
        NSHumanReadableCopyright: "© 2026 Tomoro Iwasaki"
    entitlements:
      path: Sources/Tomo/Tomo.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.network.client: true
