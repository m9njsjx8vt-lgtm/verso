name: Verso
options:
  bundleIdPrefix: com.tomoro
  deploymentTarget:
    macOS: "13.0"
  developmentLanguage: ja
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    minorVersion: 2.6.0
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Verso Self-Signed"
    DEVELOPMENT_TEAM: ""
    # Self-signed identity gives a STABLE signature across rebuilds, so macOS
    # doesn't revoke Accessibility trust each time we rebuild. Switch this to a
    # real Developer ID identity when enrolling in Apple Developer Program.
    ENABLE_HARDENED_RUNTIME: NO
    PRODUCT_NAME: Verso
    PRODUCT_BUNDLE_IDENTIFIER: com.tomoro.verso
targets:
  Verso:
    type: application
    platform: macOS
    sources:
      - path: Sources/Verso
    dependencies:
      - package: Sparkle
        product: Sparkle
    info:
      path: Sources/Verso/Generated-Info.plist
      properties:
        LSUIElement: true
        LSMinimumSystemVersion: "13.0"
        CFBundleShortVersionString: "0.10.0"
        CFBundleVersion: "14"
        CFBundleDisplayName: Verso
        CFBundleIconFile: AppIcon
        NSHighResolutionCapable: true
        NSAppleEventsUsageDescription: "Verso pastes translated text into your active application using keyboard events."
        NSScreenCaptureUsageDescription: "Verso captures the area you select to OCR and translate the text in it."
        NSAccessibilityUsageDescription: "Verso watches for ⌘C×2 and ⌥⇧C globally so you can translate from any app. It does NOT log keystrokes."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSHumanReadableCopyright: "© 2026 Tomoro Iwasaki"
        # Sparkle auto-update. Release operations are documented in docs/sparkle-handoff.md
        # and docs/sparkle-setup-todo.md.
        SUFeedURL: "https://m9njsjx8vt-lgtm.github.io/verso/appcast.xml"
        SUPublicEDKey: "AKCNvqrXaTm9pxaH2GXfK+c33/oYkW2E/tVadrdIkqQ="
        SUEnableInstallerLauncherService: false
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        # URL scheme — `open verso://translate?text=hello` from anywhere
        CFBundleURLTypes:
          - CFBundleURLName: "Verso translate URL"
            CFBundleURLSchemes:
              - verso
        # Services menu — right-click → Services → 'Versoで翻訳' on any selected text
        NSServices:
          - NSMenuItem:
              default: "Versoで翻訳"
            NSMessage: translateText
            NSPortName: Verso
            NSSendTypes:
              - public.utf8-plain-text
              - NSStringPboardType
            NSReturnTypes: []
    entitlements:
      path: Sources/Verso/Verso.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.network.client: true
